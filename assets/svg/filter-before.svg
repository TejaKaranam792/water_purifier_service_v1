<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" role="img" aria-labelledby="fb-title fb-desc">
  <title id="fb-title">Clogged Dirty RO Water Filter Before Service</title>
  <desc id="fb-desc">Heavily clogged rust and mud stained sediment filter cartridge with cloudy water before replacement.</desc>
  <defs>
    <linearGradient id="dirtyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5EE"/>
      <stop offset="100%" stop-color="#FCEBE1"/>
    </linearGradient>
    <linearGradient id="dirtyFilter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="25%" stop-color="#A0522D"/>
      <stop offset="50%" stop-color="#CD853F"/>
      <stop offset="75%" stop-color="#8B5A2B"/>
      <stop offset="100%" stop-color="#5C3317"/>
    </linearGradient>
    <linearGradient id="dirtyWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D2B48C" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8B6914" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="fbShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4A2508" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="20" fill="url(#dirtyBg)"/>
  <circle cx="200" cy="200" r="140" fill="#E76F51" fill-opacity="0.1"/>

  <!-- Dirty Filter Cartridge (Left Center) -->
  <g filter="url(#fbShadow)" transform="translate(140, 50)">
    <!-- Dirty Rust Stained Caps -->
    <rect x="0" y="0" width="80" height="22" rx="6" fill="#5C3317"/>
    <rect x="25" y="-12" width="30" height="14" rx="4" fill="#3E2210"/>
    
    <!-- Clogged Brown Filter Body -->
    <rect x="6" y="20" width="68" height="250" rx="6" fill="url(#dirtyFilter)" stroke="#5C3317" stroke-width="2"/>
    
    <!-- Heavy Mud & Sludge Grooves -->
    <g stroke="#3E2210" stroke-width="3" opacity="0.8">
      <line x1="8" y1="45" x2="72" y2="45"/>
      <line x1="8" y1="80" x2="72" y2="80"/>
      <line x1="8" y1="115" x2="72" y2="115"/>
      <line x1="8" y1="150" x2="72" y2="150"/>
      <line x1="8" y1="185" x2="72" y2="185"/>
      <line x1="8" y1="220" x2="72" y2="220"/>
      <line x1="8" y1="250" x2="72" y2="250"/>
    </g>

    <!-- Sludge Patches / Dirt Clumps -->
    <path d="M 12,60 Q 25,75 16,90 Q 28,105 18,125 Q 32,140 20,165" fill="#3D1E06" opacity="0.6"/>
    <path d="M 68,90 Q 55,105 65,120 Q 52,135 62,155 Q 50,175 66,195" fill="#3D1E06" opacity="0.6"/>

    <!-- Bottom Cap -->
    <rect x="0" y="268" width="80" height="22" rx="6" fill="#5C3317"/>
    <rect x="25" y="288" width="30" height="12" rx="4" fill="#3E2210"/>
  </g>

  <!-- Glass of Murky / Untreated Water (Right Center) -->
  <g filter="url(#fbShadow)" transform="translate(340, 80)">
    <!-- Base Shadow -->
    <ellipse cx="65" cy="225" rx="55" ry="12" fill="#3D1E06" opacity="0.25"/>

    <!-- Glass Body Outline -->
    <path d="M 12,20 L 22,210 Q 24,220 36,220 L 94,220 Q 106,220 108,210 L 118,20 Z" fill="#FFFFFF" fill-opacity="0.3" stroke="#D7CCC8" stroke-width="2.5"/>

    <!-- Murky Water -->
    <path d="M 16,65 Q 65,60 114,65 L 106,210 Q 104,216 94,216 L 36,216 Q 26,216 24,210 Z" fill="url(#dirtyWater)"/>
    <ellipse cx="65" cy="65" rx="49" ry="10" fill="#BCAAA4"/>

    <!-- Mud Particles in Water -->
    <circle cx="45" cy="110" r="3" fill="#5C3317" opacity="0.7"/>
    <circle cx="85" cy="130" r="4" fill="#5C3317" opacity="0.6"/>
    <circle cx="55" cy="165" r="3.5" fill="#3E2210" opacity="0.8"/>
    <circle cx="75" cy="185" r="2.5" fill="#5C3317" opacity="0.7"/>
  </g>

  <!-- Warning Badge -->
  <g transform="translate(40, 40)" filter="url(#fbShadow)">
    <rect x="0" y="0" width="160" height="38" rx="19" fill="#E63946"/>
    <circle cx="19" cy="19" r="11" fill="#FFFFFF"/>
    <text x="19" y="24" fill="#E63946" font-family="'Inter',sans-serif" font-size="14" font-weight="900" text-anchor="middle">!</text>
    <text x="38" y="24" fill="#FFFFFF" font-family="'Inter',sans-serif" font-size="12" font-weight="800">BEFORE SERVICE</text>
  </g>

  <!-- Issue Highlights Tag (Bottom Center) -->
  <g transform="translate(170, 345)" filter="url(#fbShadow)">
    <rect x="0" y="0" width="260" height="34" rx="17" fill="#3D1E06"/>
    <text x="130" y="22" fill="#FFB4A2" font-family="'Inter',sans-serif" font-size="11" font-weight="700" text-anchor="middle">Choked Sediment · High TDS · Foul Smell</text>
  </g>
</svg>
