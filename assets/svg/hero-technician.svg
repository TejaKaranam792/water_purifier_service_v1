<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" width="100%" height="100%" role="img" aria-labelledby="hero-title hero-desc"><title id="hero-title">Expert RO Water Purifier Technician in Visakhapatnam - HMT Aqua</title><desc id="hero-desc">Friendly Indian technician in navy uniform holding an RO filter cartridge beside a modern wall-mounted water purifier with a glass of pure water.</desc><defs><radialGradient id="heroGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#00B4D8" stop-opacity="0.45"/><stop offset="60%" stop-color="#00B4D8" stop-opacity="0.15"/><stop offset="100%" stop-color="#0A1F44" stop-opacity="0"/></radialGradient><linearGradient id="purifierBody" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="70%" stop-color="#EBF4FC"/><stop offset="100%" stop-color="#D5E8F8"/></linearGradient><linearGradient id="purifierAccent" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#004D99"/><stop offset="100%" stop-color="#0A1F44"/></linearGradient><linearGradient id="tankWater" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#00B4D8" stop-opacity="0.6"/><stop offset="50%" stop-color="#0077B6" stop-opacity="0.75"/><stop offset="100%" stop-color="#004D99" stop-opacity="0.85"/></linearGradient><linearGradient id="tankGlass" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.08"/><stop offset="75%" stop-color="#00B4D8" stop-opacity="0.05"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/></linearGradient><linearGradient id="filterWhite" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="50%" stop-color="#E2EEF9"/><stop offset="100%" stop-color="#B8D7F2"/></linearGradient><linearGradient id="filterCap" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#00B4D8"/><stop offset="100%" stop-color="#0077B6"/></linearGradient><linearGradient id="techSkin" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#D99B5E"/><stop offset="50%" stop-color="#C68642"/><stop offset="100%" stop-color="#A26428"/></linearGradient><linearGradient id="techShirt" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0F2E62"/><stop offset="70%" stop-color="#0A1F44"/><stop offset="100%" stop-color="#06142D"/></linearGradient><linearGradient id="techCap" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#004D99"/><stop offset="100%" stop-color="#0A1F44"/></linearGradient><linearGradient id="techGlove" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#C2EAF8"/><stop offset="100%" stop-color="#76CCE8"/></linearGradient><linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/><stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.15"/><stop offset="80%" stop-color="#00B4D8" stop-opacity="0.25"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4"/></linearGradient><linearGradient id="glassWater" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#48CAE4"/><stop offset="100%" stop-color="#0096C7"/></linearGradient><filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#001838" flood-opacity="0.32"/></filter><filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style> /* Hero Vector Animations */ .hero-glow-bg { animation: pulseGlow 5s ease-in-out infinite alternate; } .hero-purifier-float { animation: purifierFloat 5s ease-in-out infinite; } .hero-water-wave { animation: waterRippling 4s ease-in-out infinite alternate; } .hero-bubble-1 { animation: bubbleRise 3.2s ease-in infinite; } .hero-bubble-2 { animation: bubbleRise 2.6s 1.2s ease-in infinite; } .hero-bubble-3 { animation: bubbleRise 3.8s 0.6s ease-in infinite; } .hero-sparkle-1 { animation: sparkleTwinkle 2.4s ease-in-out infinite; } .hero-sparkle-2 { animation: sparkleTwinkle 3.1s 0.8s ease-in-out infinite; } .hero-sparkle-3 { animation: sparkleTwinkle 2.8s 1.5s ease-in-out infinite; } .hero-arm-wave { transform-origin: 395px 230px; animation: armWave 3.5s ease-in-out infinite; } .hero-tap-drop { animation: tapDrop 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite; } @keyframes purifierFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } } @keyframes pulseGlow { 0% { opacity: 0.7; transform: scale(0.98); transform-origin: center; } 100% { opacity: 1; transform: scale(1.04); transform-origin: center; } } @keyframes waterRippling { 0% { transform: translateY(0); } 100% { transform: translateY(3px); } } @keyframes bubbleRise { 0% { transform: translateY(20px); opacity: 0; } 20% { opacity: 0.8; } 80% { opacity: 0.8; } 100% { transform: translateY(-55px); opacity: 0; } } @keyframes sparkleTwinkle { 0%, 100% { transform: scale(0.3) rotate(0deg); opacity: 0.2; } 50% { transform: scale(1.1) rotate(90deg); opacity: 1; } } @keyframes armWave { 0%, 100% { transform: rotate(0deg); } 20% { transform: rotate(-8deg); } 40% { transform: rotate(3deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(2deg); } } @keyframes tapDrop { 0% { transform: translateY(0) scale(0.7); opacity: 0; } 30% { opacity: 0.9; } 75% { transform: translateY(22px) scale(1); opacity: 0.9; } 100% { transform: translateY(28px) scale(0.3); opacity: 0; } } @media (prefers-reduced-motion: reduce) { .hero-glow-bg, .hero-purifier-float, .hero-water-wave, .hero-bubble-1, .hero-bubble-2, .hero-bubble-3, .hero-sparkle-1, .hero-sparkle-2, .hero-sparkle-3, .hero-arm-wave, .hero-tap-drop { animation: none !important; } } </style><circle cx="270" cy="240" r="230" fill="url(#heroGlow)" class="hero-glow-bg"/><g class="hero-purifier-float" id="ro-purifier-unit" filter="url(#softSha