<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" role="img" aria-labelledby="step3-title step3-desc">
  <title id="step3-title">Step 3: Pure, Healthy Water Restored with Guarantee</title>
  <desc id="step3-desc">Glass of sparkling crystal pure RO drinking water with green verification checkmark badge.</desc>
  <defs>
    <linearGradient id="glassGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#BEE3F8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="waterGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48CAE4"/>
      <stop offset="50%" stop-color="#0096C7"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EC4B6"/>
      <stop offset="100%" stop-color="#00A896"/>
    </linearGradient>
    <filter id="step3Shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#002244" flood-opacity="0.2"/>
    </filter>
  </defs>
  <style>
    .step-sparkle-1 { animation: stepSparkle 2.5s ease-in-out infinite; }
    .step-sparkle-2 { animation: stepSparkle 3s 1s ease-in-out infinite; }
    .step-water-wave { animation: stepWaterRipple 3.5s ease-in-out infinite alternate; }
    @keyframes stepSparkle {
      0%, 100% { opacity: 0.3; transform: scale(0.6) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(90deg); }
    }
    @keyframes stepWaterRipple {
      0% { transform: translateY(0); }
      100% { transform: translateY(4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .step-sparkle-1, .step-sparkle-2, .step-water-wave { animation: none !important; }
    }
  </style>

  <!-- Background Soft Aura -->
  <circle cx="160" cy="160" r="130" fill="#00B4D8" fill-opacity="0.1"/>
  <circle cx="160" cy="160" r="95" fill="#2EC4B6" fill-opacity="0.1"/>

  <!-- Base Ground Shadow -->
  <ellipse cx="160" cy="265" rx="70" ry="12" fill="#001838" opacity="0.25"/>

  <!-- Glass Tumbler of Pure Water (Center) -->
  <g filter="url(#step3Shadow)" transform="translate(110, 48)">
    <!-- Glass Tumbler Outer Wall -->
    <path d="M 10,20 L 22,176 Q 24,186 36,186 L 64,186 Q 76,186 78,176 L 90,20 Z" fill="url(#glassGrad3)" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Pure Water Fill Inside -->
    <g class="step-water-wave">
      <path d="M 15,55 Q 50,48 85,55 L 76,174 Q 74,182 64,182 L 36,182 Q 26,182 24,174 Z" fill="url(#waterGrad3)"/>
      <ellipse cx="50" cy="55" rx="35" ry="8" fill="#90E0EF"/>
    </g>

    <!-- Rising Pure Water Bubbles -->
    <circle cx="36" cy="140" r="3" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="58" cy="120" r="4" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="44" cy="95" r="3.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="62" cy="72" r="2.5" fill="#FFFFFF" opacity="0.7"/>

    <!-- Glass Surface Reflections / Glare -->
    <path d="M 22,35 L 30,165" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 33,40 L 37,150" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Big Green Verification Checkmark Seal (Bottom Right of Glass) -->
  <g filter="url(#step3Shadow)" transform="translate(170, 155)">
    <circle cx="38" cy="38" r="34" fill="url(#checkGrad)" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="38" cy="38" r="28" fill="#0A1F44"/>
    <!-- Checkmark Path -->
    <path d="M 26,38 L 34,46 L 50,28" stroke="#2EC4B6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Sparkling Pure Stars -->
  <g class="step-sparkle-1" transform="translate(198, 62)">
    <path d="M 0,-12 Q 0,0 -12,0 Q 0,0 0,12 Q 0,0 12,0 Q 0,0 0,-12 Z" fill="#00B4D8"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>

  <g class="step-sparkle-2" transform="translate(80, 110)">
    <path d="M 0,-9 Q 0,0 -9,0 Q 0,0 0,9 Q 0,0 9,0 Q 0,0 0,-9 Z" fill="#2EC4B6"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Step Number Badge 03 (Bottom Left) -->
  <g transform="translate(25, 220)" filter="url(#step3Shadow)">
    <circle cx="28" cy="28" r="24" fill="#0A1F44" stroke="#00B4D8" stroke-width="2"/>
    <text x="28" y="36" fill="#00B4D8" font-family="'Inter',sans-serif" font-size="20" font-weight="900" text-anchor="middle">03</text>
  </g>
</svg>

