<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" role="img" aria-labelledby="step2-title step2-desc">
  <title id="step2-title">Step 2: Technician on Scooter with Toolbox Arriving Fast</title>
  <desc id="step2-desc">HMT Aqua technician on service scooter carrying tools for rapid 30-60 min doorstep dispatch.</desc>
  <defs>
    <linearGradient id="scooterBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="50%" stop-color="#004D99"/>
      <stop offset="100%" stop-color="#0A1F44"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#BA181B"/>
    </linearGradient>
    <filter id="step2Shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001838" flood-opacity="0.2"/>
    </filter>
  </defs>
  <style>
    .scooter-ride { animation: scooterRide 3s ease-in-out infinite alternate; }
    .motion-line { animation: motionDash 1.4s linear infinite; stroke-dasharray: 12 10; }
    @keyframes scooterRide {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }
    @keyframes motionDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -44; }
    }
    @media (prefers-reduced-motion: reduce) {
      .scooter-ride, .motion-line { animation: none !important; }
    }
  </style>

  <!-- Background Soft Aura -->
  <circle cx="160" cy="160" r="130" fill="#00B4D8" fill-opacity="0.1"/>
  <circle cx="160" cy="160" r="95" fill="#004D99" fill-opacity="0.08"/>

  <!-- Road Surface & Ground Shadow -->
  <line x1="20" y1="262" x2="300" y2="262" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="160" cy="265" rx="100" ry="10" fill="#001838" opacity="0.25"/>

  <!-- Speed Motion Lines Behind Scooter -->
  <line x1="25" y1="185" x2="115" y2="185" stroke="#00B4D8" stroke-width="2.5" stroke-linecap="round" class="motion-line"/>
  <line x1="45" y1="210" x2="135" y2="210" stroke="#2EC4B6" stroke-width="2" stroke-linecap="round" class="motion-line" style="animation-delay:0.3s"/>
  <line x1="15" y1="235" x2="85" y2="235" stroke="#0077B6" stroke-width="2.5" stroke-linecap="round" class="motion-line" style="animation-delay:0.6s"/>

  <!-- Scooter + Technician Group -->
  <g class="scooter-ride" filter="url(#step2Shadow)">
    <!-- Rear Wheel -->
    <g transform="translate(95, 230)">
      <circle cx="0" cy="0" r="26" fill="url(#wheelGrad)" stroke="#64748B" stroke-width="3"/>
      <circle cx="0" cy="0" r="14" fill="#E2E8F0"/>
      <circle cx="0" cy="0" r="5" fill="#475569"/>
    </g>

    <!-- Front Wheel -->
    <g transform="translate(225, 230)">
      <circle cx="0" cy="0" r="26" fill="url(#wheelGrad)" stroke="#64748B" stroke-width="3"/>
      <circle cx="0" cy="0" r="14" fill="#E2E8F0"/>
      <circle cx="0" cy="0" r="5" fill="#475569"/>
    </g>

    <!-- Scooter Chassis & Footboard -->
    <path d="M 95,225 L 145,230 L 195,230 L 220,180 L 210,176 L 186,220 L 140,220 L 105,210 Z" fill="url(#scooterBody)"/>
    <rect x="135" y="218" width="55" height="12" rx="4" fill="#061633"/>

    <!-- Front Cowl & Headlight -->
    <path d="M 205,178 L 225,128 L 235,134 L 216,184 Z" fill="url(#scooterBody)"/>
    <circle cx="230" cy="132" r="8" fill="#FFFBEB" stroke="#00B4D8" stroke-width="2"/>
    <polygon points="238,128 275,115 275,148" fill="#FFFBEB" opacity="0.3"/>

    <!-- Handlebar & Mirrors -->
    <line x1="218" y1="126" x2="232" y2="124" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <circle cx="218" cy="116" r="4" fill="#64748B"/>

    <!-- Rear Carrier Rack & Toolbox -->
    <g transform="translate(70, 162)">
      <!-- Carrier Plate -->
      <rect x="0" y="38" width="46" height="6" rx="3" fill="#64748B"/>
      <!-- Red Professional Service Toolkit -->
      <rect x="2" y="8" width="44" height="30" rx="5" fill="url(#boxGrad)" stroke="#9B111E" stroke-width="1.5"/>
      <rect x="0" y="6" width="48" height="6" rx="2" fill="#BA181B"/>
      <rect x="16" y="1" width="16" height="6" rx="2" fill="#CBD5E1"/>
      <!-- HMT Aqua Pure Water Drop on Toolbox -->
      <circle cx="24" cy="22" r="6" fill="#FFFFFF"/>
      <path d="M 24,18 C 22,20 20.5,22 24,25.5 C 27.5,22 26,20 24,18 Z" fill="#00B4D8"/>
    </g>

    <!-- Scooter Dual Seat -->
    <path d="M 108,194 Q 130,188 175,190 L 170,205 L 112,204 Z" fill="#1E293B"/>

    <!-- Technician Character -->
    <g id="scooter-technician">
      <!-- Legs & Navy Trousers -->
      <path d="M 135,190 L 148,220 L 165,220 L 148,188 Z" fill="#0A1F44"/>
      <ellipse cx="166" cy="222" rx="7" ry="4" fill="#1E293B"/>

      <!-- Torso in Navy Uniform -->
      <path d="M 125,140 L 145,190 L 175,190 L 155,140 Z" fill="url(#scooterBody)"/>
      <rect x="135" y="152" width="16" height="8" rx="2" fill="#2EC4B6"/>

      <!-- Arms Reaching Handlebar -->
      <path d="M 148,146 L 210,132 L 206,124 L 142,138 Z" fill="url(#scooterBody)"/>
      <ellipse cx="212" cy="130" rx="5" ry="4" fill="#D99B5E"/>

      <!-- Head & Helmet / Cap -->
      <circle cx="150" cy="115" r="14" fill="#D99B5E"/>
      <!-- Cap with Vizor Facing Forward -->
      <path d="M 136,112 C 136,96 166,96 166,112 Z" fill="#0A1F44"/>
      <path d="M 152,112 L 174,112 L 168,118 Z" fill="#00B4D8"/>
      <!-- Smiling Face -->
      <circle cx="158" cy="114" r="2" fill="#1A1A1A"/>
      <path d="M 154,121 Q 160,126 166,121" stroke="#781D1D" stroke-width="1.8" fill="none"/>
    </g>
  </g>

  <!-- Step Number Badge 02 (Bottom Left) -->
  <g transform="translate(25, 220)" filter="url(#step2Shadow)">
    <circle cx="28" cy="28" r="24" fill="#0A1F44" stroke="#00B4D8" stroke-width="2"/>
    <text x="28" y="36" fill="#00B4D8" font-family="'Inter',sans-serif" font-size="20" font-weight="900" text-anchor="middle">02</text>
  </g>
</svg>

